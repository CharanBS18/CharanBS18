<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="crimson-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @keyframes rotate-dashed {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotating-ring {
      transform-origin: 75px 100px;
      animation: rotate-dashed 16s linear infinite;
    }
    @keyframes slide-row {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .row-anim { animation: slide-row 0.6s ease-out forwards; opacity: 0; }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 2px #ff2a55); }
      50% { filter: drop-shadow(0 0 8px #00f0ff); }
    }
    .glow-pulse { animation: pulse 3s infinite; }
    ]]>
  </style>

  <!-- Frame -->
  <rect width="450" height="200" rx="12" fill="url(#grad)" stroke="#ff2a55" stroke-width="1.5"/>

  <!-- Left Side: Red Team Rank Ring -->
  <g class="glow-pulse">
    <circle cx="75" cy="100" r="48" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 6" class="rotating-ring" />
    <circle cx="75" cy="100" r="42" fill="#0d1117" stroke="#ff2a55" stroke-width="2" />
    <text x="75" y="108" fill="#00f0ff" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle">S+</text>
  </g>
  <text x="75" y="165" fill="#ff2a55" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">OPS RANK</text>

  <!-- Right Side: Stats Rows -->
  <g transform="translate(150, 20)">
    <text x="10" y="20" fill="#00f0ff" font-family="monospace" font-size="14" font-weight="bold">// RED_TEAM TELEMETRY</text>
    <line x1="10" y1="28" x2="270" y2="28" stroke="#1e293b" stroke-width="1" />

    <g transform="translate(10, 45)">
      <g class="row-anim" style="animation-delay: 0.2s;">
        <text x="0" y="12" fill="#e2e8f0" font-family="monospace" font-size="12">Total Commits</text>
        <text x="260" y="12" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">1,420</text>
        <rect x="0" y="20" width="260" height="4" rx="2" fill="#1e293b" />
        <rect x="0" y="20" width="230" height="4" rx="2" fill="url(#crimson-cyan)" />
      </g>
    </g>

    <g transform="translate(10, 80)">
      <g class="row-anim" style="animation-delay: 0.4s;">
        <text x="0" y="12" fill="#e2e8f0" font-family="monospace" font-size="12">Pull Requests</text>
        <text x="260" y="12" fill="#ff2a55" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">184</text>
        <rect x="0" y="20" width="260" height="4" rx="2" fill="#1e293b" />
        <rect x="0" y="20" width="190" height="4" rx="2" fill="url(#crimson-cyan)" />
      </g>
    </g>

    <g transform="translate(10, 115)">
      <g class="row-anim" style="animation-delay: 0.6s;">
        <text x="0" y="12" fill="#e2e8f0" font-family="monospace" font-size="12">Issues &amp; Audits</text>
        <text x="260" y="12" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">56</text>
        <rect x="0" y="20" width="260" height="4" rx="2" fill="#1e293b" />
        <rect x="0" y="20" width="150" height="4" rx="2" fill="url(#crimson-cyan)" />
      </g>
    </g>

    <g transform="translate(10, 150)">
      <g class="row-anim" style="animation-delay: 0.8s;">
        <text x="0" y="12" fill="#e2e8f0" font-family="monospace" font-size="12">Stars Earned</text>
        <text x="260" y="12" fill="#ff2a55" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">92</text>
        <rect x="0" y="20" width="260" height="4" rx="2" fill="#1e293b" />
        <rect x="0" y="20" width="175" height="4" rx="2" fill="url(#crimson-cyan)" />
      </g>
    </g>
  </g>
</svg>
