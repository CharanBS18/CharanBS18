<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" fill="none">
  <!-- Open Book Base -->
  <path d="M 10 200 Q 205 180, 205 20 C 205 20, 105 15, 10 25 Z" fill="#240046" stroke="#ff7518" stroke-width="2"/>
  <path d="M 410 200 Q 215 180, 215 20 C 215 20, 315 15, 410 25 Z" fill="#0d1117" stroke="#ff7518" stroke-width="2"/>
  
  <!-- Left Page Cover details with Wax Seal -->
  <g transform="translate(30, 40)">
    <rect width="140" height="120" rx="6" fill="#120124" stroke="#5a189a" stroke-width="1.5"/>
    <!-- Runes -->
    <path d="M 15 15 H 35 M 15 15 V 35 M 125 15 H 105 M 125 15 V 35 M 15 105 H 35 M 15 105 V 85 M 125 105 H 105 M 125 105 V 85" stroke="#5a189a" stroke-width="1"/>
    <!-- Wax Seal -->
    <circle cx="70" cy="60" r="16" fill="#8b0000" stroke="#0d1117" stroke-width="1.5"/>
    <text x="70" y="65" fill="#ff7518" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">RIP</text>
  </g>

  <!-- Right Page details -->
  <g transform="translate(235, 40)">
    <!-- Title -->
    <text x="0" y="20" fill="#ff7518" font-family="monospace" font-weight="bold" font-size="14">spellcaster-compiler</text>
    <!-- Description -->
    <foreignObject x="0" y="35" width="160" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; color: #f8f9fa; font-size: 11px; line-height: 1.4;">
        TS/JS AST compiler for reactive spells.
      </div>
    </foreignObject>
    <!-- Wax ribbon tag -->
    <rect x="0" y="115" width="70" height="18" rx="4" fill="#5a189a" fill-opacity="0.1" stroke="#5a189a"/>
    <text x="35" y="127" fill="#5a189a" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ENCHANTED</text>
  </g>
</svg>